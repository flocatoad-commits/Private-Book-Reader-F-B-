<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxoMN3YjKQoXsLQ3pdneeZKI5T2R6SvwZQNRdW4NfE8lQjBrk5W1YkehUhT78XffF-orA/exec";

    // 1. Immediate Context & Device ID Setup (Runs before any async tasks)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());

    let deviceId = localStorage.getItem("dev_id");
    if (!deviceId || deviceId.length !== 15) {
      const prefixNoise = Math.floor(10000 + Math.random() * 90000);
      const coreId = Math.floor(10000 + Math.random() * 90000);
      const suffixNoise = Math.floor(10000 + Math.random() * 90000);
      deviceId = String(prefixNoise) + String(coreId) + String(suffixNoise);
      localStorage.setItem("dev_id", deviceId);
    }

    function detectDevice() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return "Android Phone (" + screen.width + "x" + screen.height + ")";
      if (/iPad|iPhone|iPod/.test(ua)) return "iOS Device (" + screen.width + "x" + screen.height + ")";
      return "Desktop / Browser (" + navigator.platform + ")";
    }

    const deviceInfo = detectDevice();
    const formattedIdDisplay = deviceId.slice(0, 5) + "-" + deviceId.slice(5, 10) + "-" + deviceId.slice(10);
    
    // Ensure Device ID is populated immediately into DOM
    const idEl = document.getElementById("display-device-id");
    if (idEl) idEl.innerText = formattedIdDisplay;
    
    const infoEl = document.getElementById("display-device-info");
    if (infoEl) infoEl.innerText = "Device: " + deviceInfo;

    function setupWatermark(id) {
      const el = document.getElementById("watermark");
      if (el) el.innerHTML = ("<span>Licensed to #" + id + "</span> ").repeat(60);
    }
    setupWatermark(deviceId);

    // 2. Preferences (Theme, Font, Mode)
    let currentFontSize = parseFloat(localStorage.getItem("reader_font_size")) || 1.0;
    function applyFontSize() {
      document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'rem');
    }
    applyFontSize();

    let isPagedMode = localStorage.getItem("paged_mode") !== "false";
    const modeCheckbox = document.getElementById("mode-checkbox");
    if (modeCheckbox) modeCheckbox.checked = isPagedMode;

    function setTheme(theme) {
      document.body.classList.remove('theme-sepia', 'theme-light');
      if (theme === 'sepia') document.body.classList.add('theme-sepia');
      if (theme === 'light') document.body.classList.add('theme-light');

      const themeSelect = document.getElementById('theme-select');
      if (themeSelect) themeSelect.value = theme;
      localStorage.setItem('reader_theme', theme);

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        if (theme === 'sepia') metaTheme.setAttribute('content', '#f4ecd8');
        else if (theme === 'light') metaTheme.setAttribute('content', '#f5f5f5');
        else metaTheme.setAttribute('content', '#121212');
      }
    }
    const savedTheme = localStorage.getItem('reader_theme') || 'dark';
    setTheme(savedTheme);

    function adjustFontSize(delta) {
      currentFontSize = Math.min(1.5, Math.max(0.8, currentFontSize + delta));
      localStorage.setItem("reader_font_size", currentFontSize);
      applyFontSize();
      loadChapter(currentChapterIdx, currentPageIdx);
    }

    // 3. Background Registration
    if (navigator.onLine) {
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "register", deviceId: deviceId, deviceInfo: deviceInfo })
      }).catch(err => console.log("Background registration error:", err));
    }

    // 4. IndexedDB Storage Manager
    const DB_NAME = "BookReaderDB";
    const DB_VERSION = 1;
    const STORE_NAME = "book_data";

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          return reject(new Error("IndexedDB not supported"));
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveBookToDB(chapters) {
      try {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          store.put(chapters, "chapters");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        localStorage.setItem("fallback_chapters", JSON.stringify(chapters));
      }
    }

    async function loadBookFromDB() {
      try {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const request = store.get("chapters");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
      } catch (e) {
        const fallback = localStorage.getItem("fallback_chapters");
        return fallback ? JSON.parse(fallback) : null;
      }
    }

    // 5. Activation & Download Logic
    async function handleUnlock() {
      const key = document.getElementById("input-key").value.trim();
      const status = document.getElementById("status-msg");
      const btn = document.getElementById("btn-unlock");

      if (!key) {
        status.innerText = "Please enter the unlock key.";
        return;
      }

      btn.disabled = true;
      status.innerText = "Verifying with server...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "download", deviceId: deviceId, unlockKey: key })
        });
        const result = await res.json();

        if (result.success) {
          localStorage.setItem("user_entered_key", key);
          await saveBookToDB(result.chapters);
          initReader(result.chapters);
        } else {
          status.innerText = result.error;
          btn.disabled = false;
        }
      } catch (err) {
        status.innerText = "Connection failed. Check your internet connection.";
        btn.disabled = false;
      }
    }

    // 6. Reader Display and Navigation
    let globalChapters = [];
    let currentChapterIdx = 0;
    let chapterPages = [];
    let currentPageIdx = 0;

    function populateChapterSelect(chapters) {
      const select = document.getElementById("chapter-select");
      if (!select) return;
      select.innerHTML = "";
      chapters.forEach((chap, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = chap.title;
        select.appendChild(opt);
      });
    }

    function initReader(chapters) {
      globalChapters = chapters;
      document.getElementById("activation-view").classList.add("hidden");
      document.getElementById("reader-view").classList.remove("hidden");

      populateChapterSelect(chapters);
      applyModeLayout();

      const savedChap = parseInt(localStorage.getItem("bookmark_chap")) || 0;
      const savedPage = parseInt(localStorage.getItem("bookmark_page")) || 0;
      loadChapter(savedChap, savedPage);
    }

    function toggleReadingMode() {
      isPagedMode = document.getElementById("mode-checkbox").checked;
      localStorage.setItem("paged_mode", isPagedMode);
      applyModeLayout();
      loadChapter(currentChapterIdx, 0);
    }

    function applyModeLayout() {
      const pageContainer = document.getElementById("page-container");
      const scrollContainer = document.getElementById("scroll-container");
      const footerArea = document.getElementById("paged-footer-area");

      if (isPagedMode) {
        pageContainer.classList.remove("hidden");
        footerArea.classList.remove("hidden");
        scrollContainer.classList.add("hidden");
      } else {
        pageContainer.classList.add("hidden");
        footerArea.classList.add("hidden");
        scrollContainer.classList.remove("hidden");
      }
    }

    function loadChapter(chapIdx, pageIdx) {
      currentChapterIdx = Number(chapIdx);
      const sel = document.getElementById("chapter-select");
      if (sel) sel.value = currentChapterIdx;
      const chap = globalChapters[currentChapterIdx];
      if (!chap) return;

      if (isPagedMode) {
        chapterPages = paginateContent(chap.content);
        currentPageIdx = Math.max(0, Math.min(pageIdx, chapterPages.length - 1));
        renderCurrentPage();
      } else {
        renderScrollChapter(chap);
      }
      saveBookmark();
    }

    function paginateContent(htmlContent) {
      if (!htmlContent.includes("<p>") && !htmlContent.includes("<br>")) {
        htmlContent = htmlContent
          .split(/\r?\n\r?\n/)
          .map(p => `<p style="margin-bottom: 1.2em;">${p.replace(/\r?\n/g, "<br>")}</p>`)
          .join("");
      }

      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = htmlContent;
      const paragraphs = Array.from(tempDiv.children);

      if (paragraphs.length === 0) return [htmlContent];

      let pages = [];
      let currentPageHtml = "";
      let currentLength = 0;
      const MAX_CHARS_PER_PAGE = Math.floor(1300 / currentFontSize);

      paragraphs.forEach(p => {
        const pHtml = p.outerHTML;
        if (currentLength + pHtml.length > MAX_CHARS_PER_PAGE && currentPageHtml !== "") {
          pages.push(currentPageHtml);
          currentPageHtml = pHtml;
          currentLength = pHtml.length;
        } else {
          currentPageHtml += pHtml;
          currentLength += pHtml.length;
        }
      });

      if (currentPageHtml !== "") {
        pages.push(currentPageHtml);
      }

      return pages;
    }

    function renderCurrentPage() {
      const chap = globalChapters[currentChapterIdx];
      const container = document.getElementById("page-container");
      
      container.style.opacity = "0";
      setTimeout(() => {
        document.getElementById("page-title").innerText = chap.title;
        document.getElementById("page-content").innerHTML = chapterPages[currentPageIdx];
        document.getElementById("page-indicator").innerText = `Page ${currentPageIdx + 1} of ${chapterPages.length}`;
        
        document.getElementById("prev-btn").disabled = (currentChapterIdx === 0 && currentPageIdx === 0);
        document.getElementById("next-btn").disabled = (currentChapterIdx === globalChapters.length - 1 && currentPageIdx === chapterPages.length - 1);
        
        container.style.opacity = "1";
        window.scrollTo(0, 0);
      }, 150);
    }

    function renderScrollChapter(chap) {
      let formattedContent = chap.content;
      if (!formattedContent.includes("<p>") && !formattedContent.includes("<br>")) {
        formattedContent = formattedContent
          .split(/\r?\n\r?\n/)
          .map(p => `<p style="margin-bottom: 1.2em;">${p.replace(/\r?\n/g, "<br>")}</p>`)
          .join("");
      }

      document.getElementById("scroll-title").innerText = chap.title;
      document.getElementById("scroll-content").innerHTML = formattedContent;

      const nextBtn = document.getElementById("scroll-next-btn");
      if (nextBtn) {
        if (currentChapterIdx >= globalChapters.length - 1) {
          nextBtn.innerText = "နောက်တစ်ခန်းကို ဆက်လက်ပြန်ဆိုနေပါသည်။";
          nextBtn.disabled = true;
          nextBtn.style.opacity = "0.5";
        } else {
          const nextChapterTitle = globalChapters[currentChapterIdx + 1].title;
          nextBtn.innerText = `နောက်တစ်ခန်း (${nextChapterTitle}) ▶`;
          nextBtn.disabled = false;
          nextBtn.style.opacity = "1";
        }
      }

      window.scrollTo(0, 0);
    }

    function nextChapterLongMode() {
      if (currentChapterIdx < globalChapters.length - 1) {
        loadChapter(currentChapterIdx + 1, 0);
        window.scrollTo(0, 0);
      }
    }

    function saveBookmark() {
      localStorage.setItem("bookmark_chap", currentChapterIdx);
      localStorage.setItem("bookmark_page", currentPageIdx);
    }

    function nextPage() {
      if (currentPageIdx < chapterPages.length - 1) {
        currentPageIdx++;
        renderCurrentPage();
        saveBookmark();
      } else if (currentChapterIdx < globalChapters.length - 1) {
        loadChapter(currentChapterIdx + 1, 0);
      }
    }

    function prevPage() {
      if (currentPageIdx > 0) {
        currentPageIdx--;
        renderCurrentPage();
        saveBookmark();
      } else if (currentChapterIdx > 0) {
        const prevChapIdx = currentChapterIdx - 1;
        const prevPages = paginateContent(globalChapters[prevChapIdx].content);
        loadChapter(prevChapIdx, prevPages.length - 1);
      }
    }

    function handleScreenClick(event) {
      if (!isPagedMode) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;

      if (clickX < width * 0.35) {
        prevPage();
      } else if (clickX > width * 0.65) {
        nextPage();
      }
    }

    function changeChapter(val) {
      loadChapter(val, 0);
    }

    async function refreshBookContent() {
      const savedKey = localStorage.getItem("user_entered_key");
      const btn = document.getElementById("btn-sync");
      if (!savedKey) {
        alert("Unlock key not found locally.");
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerText = "Syncing...";
        btn.style.opacity = "0.6";
      }

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "download", deviceId: deviceId, unlockKey: savedKey })
        });
        const result = await res.json();
        if (result.success) {
          await saveBookToDB(result.chapters);
          globalChapters = result.chapters;
          populateChapterSelect(globalChapters);
          loadChapter(currentChapterIdx, currentPageIdx);
          alert("Book updated successfully!");
        } else {
          alert("Update failed: " + result.error);
        }
      } catch (err) {
        alert("Network error.");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Sync Updates";
          btn.style.opacity = "1";
        }
      }
    }

    // 7. Startup Check: Load saved chapters from IndexedDB
    (async function initApp() {
      try {
        let storedChapters = await loadBookFromDB();

        if (!storedChapters) {
          const legacy = localStorage.getItem("cached_chapters");
          if (legacy) {
            storedChapters = JSON.parse(legacy);
            await saveBookToDB(storedChapters);
            localStorage.removeItem("cached_chapters");
          }
        }

        if (storedChapters && storedChapters.length > 0) {
          initReader(storedChapters);
        }
      } catch (e) {
        console.error("Startup error:", e);
      }
    })();
  </script>
